services:
  mongo:
    image: mongo:7
    container_name: cms-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: cms-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/college_management
      PORT: 5000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: cms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: